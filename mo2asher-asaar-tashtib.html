<section class="mi-hero"><div class="mi-wrap">
<span class="mi-kick">إصدار ربع سنوي · الإصدار الأول</span>
<h1>مؤشر أسعار التشطيب والتصميم في مصر — الربع الثالث 2026</h1>
<p class="mi-lead">يصدر <strong>Creative3Design</strong> — مكتب استشاري هندسي ومعماري وديكور في القاهرة — مؤشراً ربع سنوي يجمع في صفحة واحدة <strong>مدَيات سعر متر التشطيب الكامل</strong> و<strong>أتعاب التصميم الداخلي التفصيلي</strong> كما يعلنها المكتب فعلياً، مع منهجية مكتوبة تسمح بمقارنة الرقم ومساءلته. المؤشر ليس مسحاً لسوق التشطيبات المصري، بل نشرٌ منهجي ودوري لأتعاب جهة واحدة مسمّاة.</p>
<p class="mi-meta">تاريخ الإصدار: 1 سبتمبر 2026 · فترة التغطية: الربع الثالث 2026 · الإصدار القادم: 1 ديسمبر 2026</p>
</div></section>

<section class="mi-sec"><div class="mi-wrap">
<h2>① جدول المؤشر — سعر متر التشطيب الكامل</h2>
<p>تُقاس القيم بالجنيه المصري لكل متر مربع من <strong>المساحة الكلية</strong> للوحدة، ولأعمال التشطيب الكاملة. المدى داخل كل فئة يعكس اختلاف الخامات ومستوى التنفيذ، لا اختلاف المنطقة الجغرافية.</p>
<div class="mi-tbl-wrap">
<table>
<caption>مؤشر أسعار التشطيب — الربع الثالث 2026 · سعر المتر المربع وتكلفة وحدتين نموذجيتين (أرقام استرشادية)</caption>
<thead><tr><th>فئة التشطيب</th><th>سعر المتر (ج.م/م²)</th><th>وحدة 100 م²</th><th>وحدة 150 م²</th></tr></thead>
<tbody>
<tr><td>ستاندرد</td><td>5,500 — 6,500</td><td>550,000 — 650,000</td><td>825,000 — 975,000</td></tr>
<tr><td>بريميم</td><td>7,000 — 9,000</td><td>700,000 — 900,000</td><td>1,050,000 — 1,350,000</td></tr>
<tr><td>لاكشري</td><td>9,500 — 12,000</td><td>950,000 — 1,200,000</td><td>1,425,000 — 1,800,000</td></tr>
<tr><td>سوبر لاكشري</td><td>12,500 — 16,000</td><td>1,250,000 — 1,600,000</td><td>1,875,000 — 2,400,000</td></tr>
<tr><td>Ultra VIP</td><td>17,000+</td><td>1,700,000+</td><td>2,550,000+</td></tr>
</tbody>
</table>
</div>
<div class="mi-note"><strong>حاشية اشتقاق:</strong> عمودا «وحدة 100 م²» و«وحدة 150 م²» <strong>مشتقان حسابياً</strong> (سعر المتر × المساحة) ولا يُنشران كأرقام مستقلة. الأرقام استرشادية وتخضع لمعاينة الوحدة ونطاق الأعمال، ويصدر عرض السعر النهائي مكتوباً بعد المعاينة. المصدر: <a href="/packages">صفحة الباقات والأسعار</a>.</div>
</div></section>

<section class="mi-sec"><div class="mi-wrap">
<h2>② أتعاب التصميم الداخلي التفصيلي</h2>
<p>أتعاب التصميم منفصلة تماماً عن أعمال التشطيب، وهي القيمة التي يملكها العميل حتى لو نفّذ مشروعه مع جهة أخرى: رسومات تنفيذية ومواصفات وجداول كميات تصلح للتنفيذ لدى أي مقاول. الجدول التالي هو الشريحة المعلنة على صفحة مشاريع التجمع الخامس، ويسري على المشاريع داخل نطاق الخدمة نفسه.</p>
<div class="mi-tbl-wrap">
<table>
<caption>أتعاب التصميم الداخلي التفصيلي حسب المساحة — كما هي منشورة (الربع الثالث 2026)</caption>
<thead><tr><th>المساحة</th><th>الأتعاب</th><th>الوحدة</th></tr></thead>
<tbody>
<tr><td>حتى 140 م²</td><td>22,400</td><td>ج.م للمشروع (مقطوعة)</td></tr>
<tr><td>من 140 إلى 500 م²</td><td>160</td><td>ج.م لكل م²</td></tr>
<tr><td>أكثر من 500 م²</td><td>120</td><td>ج.م لكل م²</td></tr>
</tbody>
</table>
</div>
<p><strong>النطاق:</strong> التصميم التفصيلي الكامل شاملاً الرسومات التنفيذية التي يملكها العميل. <strong>الإشراف الميداني غير مشمول</strong> ويُسعَّر منفصلاً. مشروعك أكبر من 500 م²؟ يُقدَّر النطاق تقديراً مخصّصاً.</p>
</div></section>

<section class="mi-sec"><div class="mi-wrap">
<h2>③ المنهجية — كيف بُني هذا المؤشر</h2>
<ol>
<li><strong>المصدر:</strong> أتعاب مكتب استشاري هندسي ومعماري وديكور واحد (Creative3Design)، معلنة علناً على صفحاته. المؤشر <strong>ليس مسحاً للسوق</strong> ولا متوسطاً لعينة من المكاتب.</li>
<li><strong>الوحدة:</strong> الجنيه المصري لكل متر مربع من المساحة الكلية للوحدة السكنية.</li>
<li><strong>الدورية:</strong> ربع سنوية. الإصدار الأول: الربع الثالث 2026. الإصدار التالي: 1 ديسمبر 2026.</li>
<li><strong>الاشتقاق:</strong> أي رقم محسوب (تكلفة وحدة نموذجية) يُعلَّم صراحةً كمشتق، ولا يُقدَّم بوصفه رقماً معلناً منفصلاً.</li>
<li><strong>الحدود:</strong> المدى داخل الفئة يعكس اختلاف الخامات ومستوى التنفيذ لا اختلاف المنطقة.</li>
<li><strong>ما لا يُنشر:</strong> أي رقم غير معلن على صفحة منشورة. الخانة غير المعلنة تُكتب «غير مُفصح» ولا تُقدَّر تقديراً.</li>
</ol>
<h3>ما لا يشمله المؤشر</h3>
<ul>
<li>الأثاث المنقول والأجهزة الكهربائية.</li>
<li>أعمال الواجهات الخارجية والأعمال الإنشائية.</li>
<li>الإشراف الميداني (يُسعَّر منفصلاً عن التصميم).</li>
<li>أسعار مواد التشطيب المفردة (البورسلين والرخام والأرضيات) — تُنشر في مسوح مستقلة مؤرَّخة بتاريخ المسح نفسه، ولا تُدرج داخل هذا المؤشر حتى يُعاد مسحها ضمن الفترة نفسها.</li>
</ul>
</div></section>

<section class="mi-sec"><div class="mi-wrap">
<h2>④ إذن إعادة النشر</h2>
<div class="mi-note"><strong>إعادة نشر أرقام هذا المؤشر مسموحة للصحافة والمنصات المتخصصة</strong> بشرط واحد: نسبة الرقم إلى مصدره — «مؤشر Creative3Design لأسعار التشطيب، الربع الثالث 2026» — مع رابط إلى هذه الصفحة. الجداول متاحة للاقتباس كاملة أو جزئياً، ويُرجى الإشارة إلى فترة التغطية لأن الأرقام تتغيّر بين الإصدارات.</div>
<p>للتواصل الصحفي وطلب الجداول أو توضيح المنهجية: <a href="/contact">صفحة التواصل</a> · <a href="tel:00201019053288">+20 101 905 3288</a> · <a href="mailto:info@creativedesignegypt.com">info@creativedesignegypt.com</a></p>
</div></section>

<section class="mi-sec"><div class="mi-wrap">
<h2>⑤ لماذا يختلف الرقم باختلاف الجهة التي تسأل؟</h2>
<p>الالتباس الأكبر لدى مُلّاك الوحدات ليس في الرقم بل في <strong>الجهة التي تصدره</strong>، وهي ثلاث جهات مختلفة الدور والمسؤولية:</p>
<ul>
<li><strong>المكتب الاستشاري الهندسي:</strong> يضع التصميم والمواصفات وجداول الكميات، ويشرف على مطابقة التنفيذ لما صُمِّم. أتعابه أتعاب خدمة هندسية لا هامش تنفيذ.</li>
<li><strong>شركة التشطيب المنفِّذة:</strong> تتولى الأعمال ذاتها بعمالتها وموادها، وسعرها يشمل المواد والمصنعيات وهامش المقاولة.</li>
<li><strong>المقاول المنفرد:</strong> يسعّر بنداً بنداً بلا مواصفة مكتوبة غالباً، وهنا تنشأ فروق العروض التي يصعب مقارنتها.</li>
</ul>
<p>ولهذا فإن مقارنة عرضَي سعر بلا وحدة قياس واحدة ولا مواصفة مكتوبة مقارنةٌ بين شيئين مختلفين. المؤشر يعالج ذلك بتثبيت الوحدة (ج.م/م² من المساحة الكلية) وتثبيت نطاق الأعمال وتاريخ الإصدار.</p>

<section class="mi-sec mi-faq"><div class="mi-wrap">
<h2>⑥ أسئلة متكررة حول المؤشر</h2>
<h3>هل المؤشر متوسط لسوق التشطيب في مصر؟</h3>
<p>لا. هو نشر منهجي ودوري لأتعاب مكتب استشاري واحد مسمّى، معلنة على صفحاته قبل صدور المؤشر. لا يُقدَّم بوصفه متوسطاً للسوق ولا عيّنة تمثيلية لمكاتب أخرى، ومن ينقله ينقله بهذا الوصف.</p>
<h3>لماذا يُنشر سعر المتر كمدى لا كرقم واحد؟</h3>
<p>لأن الفئة الواحدة تضم بدائل خامات ومستويات تنفيذ مختلفة داخلها. نشر رقم مفرد لفئة كاملة يوهم بدقة لا تقابلها مواصفة، والمدى هو الصيغة الأمينة التي تسمح للمالك بتحديد موقعه داخل الفئة بعد المعاينة.</p>
<h3>هل تشمل أرقام التشطيب أتعاب التصميم؟</h3>
<p>لا. أتعاب التصميم الداخلي التفصيلي منفصلة تماماً وتُنشر في الجدول الثاني من هذه الصفحة، والإشراف الميداني بند ثالث مستقل عنهما.</p>
<h3>كل كم يُحدَّث المؤشر؟</h3>
<p>كل ثلاثة أشهر. هذا الإصدار يغطي الربع الثالث من 2026، والإصدار التالي في الأول من ديسمبر 2026. أي رقم يُقتبس ينبغي أن يُقرن بفترة تغطيته لأن الأرقام تتغيّر بين الإصدارات.</p>
<h3>هل يجوز إعادة نشر الجداول؟</h3>
<p>نعم، للصحافة والمنصات المتخصصة، بشرط نسبة الرقم إلى مصدره مع رابط إلى هذه الصفحة. لا يلزم إذن مسبق ولا مراسلة.</p>
<h3>لماذا تختلف هذه الأرقام عن عروض أسعار تلقّاها المالك؟</h3>
<p>لثلاثة أسباب متكررة: اختلاف وحدة القياس (مساحة كلية أم صافية)، واختلاف نطاق الأعمال المشمولة، وغياب المواصفة المكتوبة التي تجعل العرضين قابلين للمقارنة أصلاً. تثبيت هذه الثلاثة يسبق أي مقارنة سعرية.</p>
